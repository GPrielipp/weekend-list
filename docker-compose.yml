services:
  web:
    build: 
      context: ./frontend
      dockerfile: Dockerfile 
    restart: always
    stdin_open: true
    container_name: react
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: 0
    command: npm start
    networks:
      - weekend-list
    depends_on:
      - sql

  sql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
      # initialize the tables if nothing is there
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - weekend-list
    
  api:
    build:
      context: ./backend
    container_name: php
    ports:
     - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - sql
    networks:
      - weekend-list
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    restart: always
    environment:
      # CRITICAL: This must match the name of your database SERVICE
      PMA_HOST: sql
      PMA_PORT: 3306
      # Optional: Allows you to log in without typing the server name manually
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"
    depends_on:
      - sql
    networks:
      - weekend-list

volumes:
  db:

networks:
  weekend-list:
    driver: bridge